[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeg-pipeline"
version = "0.1.0"
description = "A modular, BIDS-compatible M/EEG analysis pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Léon Bartosch" }
]
dependencies = [
    "mne",
    "mne-bids",
    "numpy",
    "pandas",
    "pyyaml",
]

[project.scripts]
meegpipe = "meeg_pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88