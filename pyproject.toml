[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeg-pipeline"
version = "0.1.0"
description = "A modular, BIDS-compatible M/EEG analysis pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Léon Bartosch" }
]
dependencies = [
    "mne",
    "mne-bids",
    "mne-connectivity",
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
]

[project.scripts]
meegpipe = "meeg_pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
    "pytest",
    "ruff",
]

qt = [
    "mne-qt-browser",
    "pyqt6",
    "pyqtgraph",
    "pyvistaqt",
]

anatomy = [
    "nibabel",
    "vtk",
    "pyvista",
]

autoreject = [
    "autoreject",
]

all = [
    "ipykernel",
    "jupyter",
    "pytest",
    "ruff",
    "mne-qt-browser",
    "pyqt6",
    "pyqtgraph",
    "autoreject",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeg_pipeline = [
    "templates/**/*.ipynb",
    "templates/**/*.json",
    "templates/**/*.md",
    "templates/**/*.tsv",
    "templates/**/*.yaml",
    "templates/**/README",
]

[tool.ruff]
line-length = 88